name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
labels:
  - bug
  - needs-triage
body:
  - type: markdown
    attributes:
      value: Please remove private assets and sensitive data before posting.
  - type: input
    id: version
    attributes:
      label: App version / commit
      placeholder: v0.7.0 or commit SHA
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome, Firefox, etc.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include a small example when possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / console errors
    validations:
      required: true
